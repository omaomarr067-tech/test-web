<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الخدمات والمنتجات الرقمية الاحترافي</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-color: #7c3aed;
            --whatsapp-green: #25d366;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 10px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        /* أدوات التصفية والبحث */
        .controls-bar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        @media (min-width: 768px) {
            .controls-bar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 10px 18px;
            border: none;
            background: var(--bg-color);
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
            border: 1px solid var(--border-color);
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* شبكة عرض المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #0f172a;
        }

        .product-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .product-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .product-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .product-price {
            font-weight: 700;
            font-size: 1.1rem;
            color: #34d399;
        }

        .product-qty {
            font-size: 0.8rem;
            background: #334155;
            padding: 3px 8px;
            border-radius: 6px;
            color: #cbd5e1;
        }

        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--whatsapp-green);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            transition: opacity 0.2s;
        }

        .whatsapp-btn:hover {
            opacity: 0.9;
        }

        .whatsapp-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        /* قسم تسجيل الدخول ولوحة التحكم */
        .admin-section {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-top: 50px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .login-box {
            max-width: 400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .admin-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .admin-form input, .admin-form textarea, .admin-form select, .login-box input {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
        }

        .admin-form textarea {
            grid-column: span 2;
        }

        .btn-action {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: #ef4444;
        }
        .btn-danger:hover { background: #dc2626; }

        .btn-warning {
            background: #f59e0b;
        }
        .btn-warning:hover { background: #d97706; }

        #imgPreview {
            max-width: 120px;
            max-height: 120px;
            display: none;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .admin-list {
            margin-top: 25px;
        }

        .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .admin-btns {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>متجر الخدمات والمنتجات الرقمية</h1>
        <p style="color: var(--text-muted)">تصفح أفضل العروض والخدمات وتواصل مباشرة عبر الواتساب</p>
    </header>
    
    <!-- أدوات البحث والتصفية -->
    <div class="controls-bar">
        <div class="search-box">
            <input type="text" id="searchInput" oninput="handleSearch()" placeholder="🔍 ابحث عن منتج بالاسم أو الوصف...">
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="filterCategory('all', this)">الكل</button>
            <button class="tab-btn" onclick="filterCategory('print', this)">طباعة رقمية</button>
            <button class="tab-btn" onclick="filterCategory('wedding', this)">مستلزمات أفراح</button>
        </div>
    </div>

    <!-- شبكة عرض المنتجات -->
    <div id="productsContainer" class="products-grid">
        <!-- يتم التعبئة ديناميكياً -->
    </div>

    <!-- لوحة التحكم الإدارية (محمية بكلمة مرور) -->
    <div id="adminSection" class="admin-section">
        
        <!-- نموذج تسجيل الدخول للمدير (يظهر عندما لا يكون مسجلاً) -->
        <div id="authContainer" class="login-box">
            <h3 style="text-align: center; margin-bottom: 10px;">تسجيل دخول المدير</h3>
            <input type="email" id="adminEmail" placeholder="البريد الإلكتروني للآدمين">
            <input type="password" id="adminPassword" placeholder="كلمة المرور">
            <button class="btn-action" onclick="loginAdmin()">دخول لوحة التحكم</button>
        </div>

        <!-- محتوى لوحة التحكم (مخفي افتراضياً حتى يتم تسجيل الدخول) -->
        <div id="adminContent" style="display: none;">
            <div class="admin-header">
                <h2>إدارة المنتجات والعروض</h2>
                <button class="btn-action btn-danger" onclick="logoutAdmin()">تسجيل الخروج</button>
            </div>

            <form id="productForm" class="admin-form">
                <input type="hidden" id="productId">
                <input type="text" id="title" placeholder="اسم المنتج / الخدمة" required>
                <select id="category" required>
                    <option value="print">طباعة رقمية</option>
                    <option value="wedding">مستلزمات أفراح</option>
                </select>
                <input type="text" id="price" placeholder="السعر (مثال: 5000 ريال)" required>
                <input type="text" id="qty" placeholder="الكمية أو حالة التوفر">
                <input type="text" id="imageUrl" placeholder="رابط الصورة المباشر" oninput="previewImage(this.value)">
                <input type="text" id="phone" value="96773269355" placeholder="رقم الواتساب" required>
                <textarea id="desc" rows="3" placeholder="تفاصيل ووصف المنتج..."></textarea>
                
                <div style="grid-column: span 2;">
                    <img id="imgPreview" alt="معاينة الصورة">
                </div>
                
                <button type="submit" id="submitBtn" class="btn-action" style="grid-column: span 2;">نشر وعرض المنتج فوراً</button>
            </form>

            <div class="admin-list" id="adminProductsList">
                <!-- قائمة المنتجات للتحكم بها -->
            </div>
        </div>

    </div>
</div>

<script>
    // 1. إعدادات Firebase 
    const firebaseConfig = {
        databaseURL: "https://YOUR_FIREBASE_DATABASE_URL.firebaseio.com" // استبدل برابط قاعدة بياناتك الحقيقي
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    const auth = firebase.auth();

    // متغيرة الحالة العامة
    let allProducts = [];
    let currentCategory = 'all';
    let searchQuery = '';

    // 2. مراقبة حالة تسجيل دخول المدير (Auth State Listener)
    auth.onAuthStateChanged((user) => {
        const authContainer = document.getElementById('authContainer');
        const adminContent = document.getElementById('adminContent');
        if (user) {
            authContainer.style.display = 'none';
            adminContent.style.display = 'block';
            loadAdminProducts();
        } else {
            authContainer.style.display = 'flex';
            adminContent.style.display = 'none';
        }
    });

    function loginAdmin() {
        const email = document.getElementById('adminEmail').value;
        const pass = document.getElementById('adminPassword').value;
        auth.signInWithEmailAndPassword(email, pass)
            .then(() => alert('تم تسجيل الدخول بنجاح!'))
            .catch(err => alert('خطأ في تسجيل الدخول: ' + err.message));
    }

    function logoutAdmin() {
        auth.signOut();
    }

    // 3. جلب البيانات وتطبيق البحث والتصنيف المباشر
    function fetchProductsData() {
        database.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            allProducts = [];
            if (data) {
                for (let id in data) {
                    allProducts.push({ id: id, ...data[id] });
                }
            }
            renderProducts();
        });
    }

    function renderProducts() {
        const container = document.getElementById('productsContainer');
        container.innerHTML = '';

        // تصفية المنتجات بالبحث + التصنيف
        const filtered = allProducts.filter(p => {
            const matchesCat = (currentCategory === 'all' || p.category === currentCategory);
            const titleMatch = (p.title || '').toLowerCase().includes(searchQuery.toLowerCase());
            const descMatch = (p.desc || '').toLowerCase().includes(searchQuery.toLowerCase());
            return matchesCat && (titleMatch || descMatch);
        });

        if (filtered.length === 0) {
            container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted); padding: 40px 0;">لا توجد منتجات مطابقة لخيارات البحث الحالية.</p>';
            return;
        }

        filtered.forEach(p => {
            const imgSrc = (p.image && p.image !== 'undefined' && p.image.trim() !== '') ? p.image : 'https://via.placeholder.com/300x200?text=No+Image';
            const descText = (p.desc && p.desc !== 'undefined') ? p.desc : '';
            const qtyText = (p.qty && p.qty !== 'undefined') ? p.qty : 'متوفر';
            const phoneNum = (p.phone && p.phone !== 'undefined') ? p.phone : '96773269355';
            
            const whatsappMsg = encodeURIComponent(`مرحباً، أرجو الاستفسار عن المنتج: ${p.title} - السعر: ${p.price}`);
            const whatsappLink = `https://wa.me/${phoneNum}?text=${whatsappMsg}`;

            container.innerHTML += `
                <div class="product-card">
                    <img src="${imgSrc}" class="product-img" alt="${p.title}">
                    <div class="product-info">
                        <div>
                            <div class="product-title">${p.title}</div>
                            <div class="product-desc">${descText}</div>
                        </div>
                        <div>
                            <div class="product-meta-row">
                                <div class="product-price">${p.price}</div>
                                <div class="product-qty">${qtyText}</div>
                            </div>
                            <a href="${whatsappLink}" class="whatsapp-btn" target="_blank">
                                <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.5-5.754-1.446L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.799.002-2.63-1.023-5.101-2.885-6.963C16.528 2.028 14.061.966 11.454.966c-5.443 0-9.874 4.375-9.878 9.802-.001 1.748.463 3.454 1.343 4.967l-.983 3.595 3.711-.966zm12.108-6.11c-.328-.164-1.94-.954-2.242-1.063-.301-.109-.522-.164-.742.164-.219.328-.85 1.063-1.041 1.281-.192.219-.384.246-.712.082-1.399-.699-2.309-1.222-3.114-2.602-.212-.365.212-.34.607-1.127.066-.137.033-.257-.016-.355-.05-.099-.443-1.063-.607-1.457-.159-.384-.334-.333-.459-.34l-.394-.008c-.137 0-.361.051-.548.257-.188.206-.717.7-.717 1.709 0 1.009.734 1.984.836 2.121.102.137 1.444 2.201 3.495 3.086.488.21.87.336 1.167.431.49.155.936.133 1.288.08.393-.058 1.94-.793 2.214-1.523.274-.73.274-1.355.192-1.485-.082-.131-.274-.164-.602-.328z"/></svg>
                                طلب عبر الواتساب
                            </a>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // التعامل مع شريط البحث والتبويب
    function handleSearch() {
        searchQuery = document.getElementById('searchInput').value;
        renderProducts();
    }

    function filterCategory(cat, btn) {
        currentCategory = cat;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProducts();
    }

    // 4. العمليات الإدارية (إضافة/تعديل/حذف)
    const productForm = document.getElementById('productForm');
    const submitBtn = document.getElementById('submitBtn');
    const productIdInput = document.getElementById('productId');

    productForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const id = productIdInput.value;
        const pData = {
            title: document.getElementById('title').value,
            category: document.getElementById('category').value,
            price: document.getElementById('price').value,
            qty: document.getElementById('qty').value,
            desc: document.getElementById('desc').value,
            image: document.getElementById('imageUrl').value,
            phone: document.getElementById('phone').value
        };

        if (id) {
            database.ref('products/' + id).set(pData, (err) => {
                if (!err) {
                    alert('تم تحديث المنتج بنجاح!');
                    resetForm();
                }
            });
        } else {
            database.ref('products').push().set(pData, (err) => {
                if (!err) {
                    alert('تم إضافة المنتج بنجاح!');
                    resetForm();
                }
            });
        }
    });

    function loadAdminProducts() {
        database.ref('products').on('value', (snapshot) => {
            const list = document.getElementById('adminProductsList');
            list.innerHTML = '';
            const data = snapshot.val();
            if (!data) return;

            for (let id in data) {
                const p = data[id];
                const displayCat = p.category === 'wedding' ? 'مستلزمات أفراح' : 'طباعة رقمية';
                list.innerHTML += `
                    <div class="admin-item">
                        <div><strong>${p.title}</strong> (${p.price}) - <small style="color:var(--text-muted)">${displayCat}</small></div>
                        <div class="admin-btns">
                            <button class="btn-action btn-warning" onclick="startEdit('${id}', '${encodeURIComponent(p.title || '')}', '${p.category || 'print'}', '${encodeURIComponent(p.price || '')}', '${encodeURIComponent(p.qty || '')}', '${encodeURIComponent(p.desc || '')}', '${encodeURIComponent(p.image || '')}', '${p.phone || '96773269355'}')">تعديل</button>
                            <button class="btn-action btn-danger" onclick="deleteProduct('${id}')">حذف</button>
                        </div>
                    </div>
                `;
            }
        });
    }

    function deleteProduct(id) {
        if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
            database.ref('products/' + id).remove();
        }
    }

    function startEdit(id, title, cat, price, qty, desc, img, phone) {
        productIdInput.value = id;
        document.getElementById('title').value = decodeURIComponent(title);
        document.getElementById('category').value = cat;
        document.getElementById('price').value = decodeURIComponent(price);
        document.getElementById('qty').value = (qty === 'undefined' || !qty) ? '' : decodeURIComponent(qty);
        document.getElementById('desc').value = (desc === 'undefined' || !desc) ? '' : decodeURIComponent(desc);
        document.getElementById('phone').value = phone;
        
        const decodedImg = (img && img !== 'undefined') ? decodeURIComponent(img) : '';
        if (decodedImg.trim() !== "") {
            document.getElementById('imageUrl').value = decodedImg;
            previewImage(decodedImg);
        } else {
            document.getElementById('imageUrl').value = "";
            document.getElementById('imgPreview').style.display = "none";
        }
        
        submitBtn.innerText = "تحديث التعديلات الآن";
        submitBtn.style.background = "var(--accent-color)";
        window.scrollTo({ top: document.getElementById('adminSection').offsetTop, behavior: 'smooth' });
    }

    function previewImage(url) {
        const preview = document.getElementById('imgPreview');
        if (url && url.trim() !== "") {
            preview.src = url;
            preview.style.display = "block";
        } else {
            preview.style.display = "none";
        }
    }

    function resetForm() {
        productForm.reset(); 
        productIdInput.value = ''; 
        document.getElementById('imgPreview').style.display = "none";
        document.getElementById('phone').value = "96773269355";
        submitBtn.innerText = "نشر وعرض المنتج فوراً"; 
        submitBtn.style.background = "var(--primary-color)";
    }

    window.onload = fetchProductsData;
</script>

</body>
</html>
