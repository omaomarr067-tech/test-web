<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وظائف مصنع الندى للمياه المعدنية</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
  body { background:linear-gradient(135deg,#0b6ea8,#0e9fd8); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#fff; max-width:520px; width:100%; border-radius:18px; padding:35px 30px; box-shadow:0 15px 40px rgba(0,0,0,.25); }
  .logo { text-align:center; margin-bottom:20px; }
  .logo .icon { font-size:52px; }
  .logo h1 { color:#0b6ea8; font-size:22px; }
  .logo p { color:#777; font-size:14px; margin-top:4px; }
  label { display:block; font-weight:600; color:#333; margin:14px 0 6px; font-size:14px; }
  input, select, textarea { width:100%; padding:12px 14px; border:1.5px solid #d5e3ec; border-radius:10px; font-size:15px; transition:.2s; background:#f9fcfe; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:#0e9fd8; box-shadow:0 0 0 3px rgba(14,159,216,.15); }
  textarea { resize:vertical; min-height:80px; }
  button { width:100%; margin-top:22px; padding:14px; background:linear-gradient(135deg,#0b6ea8,#0e9fd8); color:#fff; border:none; border-radius:10px; font-size:17px; font-weight:700; cursor:pointer; transition:.2s; }
  button:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(11,110,168,.4); }
  button:disabled { opacity:.6; cursor:not-allowed; transform:none; }
  .msg { display:none; margin-top:14px; padding:12px; border-radius:10px; text-align:center; font-weight:600; }
  .ok { display:block; background:#e6f7ec; color:#1a7f37; }
  .err { display:block; background:#fdecea; color:#c0392b; }
  .note { font-size:12px; color:#999; text-align:center; margin-top:16px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon">💧</div>
    <h1>مصنع الندى للمياه المعدنية</h1>
    <p>نموذج التقديم على الوظائف</p>
  </div>
  <form id="jobForm">
    <label>الاسم الكامل *</label>
    <input type="text" id="name" required>

    <label>رقم الهاتف / واتساب *</label>
    <input type="tel" id="phone" required placeholder="05xxxxxxxx">

    <label>المدينة *</label>
    <input type="text" id="city" required>

    <label>الوظيفة المتقدم لها *</label>
    <select id="job" required>
      <option value="">-- اختر الوظيفة --</option>
      <option>مشغل خط إنتاج</option>
      <option>سائق شاحنة / توصيل</option>
      <option>عامل تخزين ومستودعات</option>
      <option>مندوب مبيعات</option>
      <option>فني صيانة</option>
      <option>محاسب</option>
      <option>موارد بشرية</option>
      <option>أخرى</option>
    </select>

    <label>سنوات الخبرة</label>
    <select id="exp">
      <option>بدون خبرة</option>
      <option>أقل من سنة</option>
      <option>1 - 3 سنوات</option>
      <option>أكثر من 3 سنوات</option>
    </select>

    <label>نبذة عنك (اختياري)</label>
    <textarea id="about" placeholder="مؤهلاتك، خبراتك السابقة..."></textarea>

    <button type="submit" id="btn">📨 إرسال الطلب</button>
    <div id="msg" class="msg"></div>
  </form>
  <p class="note">سيصل طلبك مباشرة إلى قسم التوظيف وسنعاود التواصل معك.</p>
</div>

<script>
// ===== ضع بياناتك هنا =====
const BOT_TOKEN = "ضع_توكن_البوت_هنا";
const CHAT_ID   = "ضع_رقم_المحادثة_هنا";

document.getElementById("jobForm").addEventListener("submit", async function(e){
  e.preventDefault();
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "جارٍ الإرسال...";
  msg.className = "msg";

  const g = id => document.getElementById(id).value.trim();
  const text =
`📢 *طلب توظيف جديد - مصنع الندى للمياه المعدنية*

👤 الاسم: ${g("name")}
📱 الهاتف: ${g("phone")}
🏙️ المدينة: ${g("city")}
💼 الوظيفة: ${g("job")}
📊 الخبرة: ${g("exp")}
📝 نبذة: ${g("about") || "—"}`;

  try {
    const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: "Markdown" })
    });
    const data = await res.json();
    if (data.ok) {
      msg.className = "msg ok";
      msg.textContent = "✅ تم إرسال طلبك بنجاح، سنتواصل معك قريبًا!";
      document.getElementById("jobForm").reset();
    } else {
      throw new Error(data.description);
    }
  } catch(err) {
    msg.className = "msg err";
    msg.textContent = "❌ حدث خطأ، حاول مرة أخرى أو تواصل معنا هاتفيًا.";
    console.error(err);
  } finally {
    btn.disabled = false; btn.textContent = "📨 إرسال الطلب";
  }
});
</script>
</body>
</html>
